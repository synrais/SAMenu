; ===================================================================
; SAMenu.ini - Configuration file for SAMenu
; ===================================================================
; COMMAND CHEAT SHEET  (run over SSH, or from any script)
; -------------------------------------------------------------------
;   /media/fat/Scripts/SAMenu.sh <option>
;
;   (no option)          open SAMenu
;
;   Attract mode
;   -attract             start attract mode (its log on screen)
;   -attract -bg         start it in the background
;                        (log: /tmp/SAMenu_attract.log)
;   -attract Nintendo    only these systems or groups, this run
;   -attract -playlist "Fighters Night"
;                        use this attract playlist, this run
;                        (e.g. -attract SNES,Console)
;   -status              is it running, and what's playing?
;   -next / -back        next or previous game
;   -play                stop the show, keep playing this game
;   -stay                stay on this game (again to carry on)
;   -blacklist           never play this game again, next game
;   -stop                stop attract mode, back to the MiSTer menu
;   -menu                open SAMenu on the TV (closes the game)
;   -search              ...straight into its Search screen
;   -find mario 3        attract mode plays the games matching all the
;                        words first, then carries on as normal
;                        (the same as pressing ` once and typing)
;
;   Games
;   -launch <file>       launch a game, e.g.
;                        -launch /media/fat/games/NES/Tetris.nes
;   -launch <file> -system Atari2600
;                        launch as this system (ID or name), not guessed
;   -launch <file> -core _Unstable/NES
;                        use another core, loading the file the usual way
;                        (with -system if the system can't be guessed)
;   -random              launch a random game
;   -random Nintendo     ...from these systems or groups
;   -list                print every game in the database
;   -genres              the genres found in it, with counts per system
;   -rebuild             rebuild the games database (no screens)
;
;   Music player
;   -music start / stop  start or stop the background music
;   -music next          next track
;   -music status        what's playing
;
;   Video player  (videos in /media/fat/video, folders = playlists)
;   -video play          play the playlist set in [Video]
;   -video play <file>   one video, e.g.
;                        -video play /media/fat/video/intro.mp4
;   -video play <folder> a folder, by name or path, e.g.
;                        -video play Trailers   (All = every video)
;   -video play -        play a video piped in from a PC, e.g.
;                        cat movie.mkv | ssh root@<mister-ip>
;                          "/media/fat/Scripts/SAMenu.sh -video play -"
;                        (keeps the SSH session open; MKV/TS/WebM
;                        stream best, MP4s need "faststart")
;   -video next / stop   next video, or stop (back to the MiSTer menu)
;   -video status        what's playing
;
;   Testing
;   -inputs              print every key, click and controller press
;   -press start         press buttons on the virtual pad
;                        (a b x y l r select start home up down left
;                        right, key:enter..., numbers = pauses)
;   -watch               live static detector status
;
;   -launch, -random and -video play end a running attract mode
;   first; the other options never disturb a running menu or attract
;   mode.
; ===================================================================
; Valid System IDs (from systems.go):
;
; === Console Systems ===
; 3DO, AdventureVision, AmigaCD32, AmigaCDTV, Arcadia, Astrocade,
; Atari2600, Atari5200, Atari7800, CasioPV1000, CDI, ChannelF,
; ColecoVision, CreatiVision, FDS, Intellivision, Jaguar, JaguarCD,
; MasterSystem, MegaCD, MegaDrive, NeoGeo, NeoGeoCD, NES, Nintendo64,
; Odyssey2, PSX, Saturn, Sega32X, SG1000, SNES, SuperGameboy, SuperGrafx,
; TurboGrafx16, TurboGrafx16CD, VC4000, Vectrex, VirtualBoy
;
; === Handheld Systems ===
; AtariLynx, Gamate, GameAndWatch, Gameboy, Gameboy2P, GameboyColor,
; GameGear, GBA, GBA2P, MegaDuck, NeoGeoPocket, NeoGeoPocket-Color,
; PocketChallengeV2, PokemonMini, SuperVision, WonderSwan, WonderSwanColor
;
; === Computer Systems ===
; AcornAtom, AcornElectron, AliceMC10, Amiga, AmigaVision, Amstrad,
; AmstradPCW, ao486, Apogee, AppleI, AppleII, Aquarius, Atari800, BBCMicro,
; BK0011M, C16, C64, CasioPV2000, CoCo2, EDSAC, Galaksija, Interact,
; Jupiter, Laser, Lynx48, MacPlus, MSX, MSX1, MultiComp, Orao, Oric, PCXT,
; PDP1, PET2001, PMD85, QL, RX78, SAMCoupe, SordM5, Specialist, SVI328,
; TatungEinstein, TI994A, TomyTutor, TRS80, TSConf, UK101, Vector06C,
; VIC20, X68000, ZX81, ZXNext, ZXSpectrum
;
; === Arcade Systems ===
; Arcade
;
; === Other Systems ===
; Arduboy, Chip8, Groovy, NESMusic, SNESMusic
;
; === Groups ===
; Anywhere a system ID is accepted, a group can be used too:
;   Categories:    Console, Handheld, Computer, Arcade, Other
;   Manufacturers: Acorn, Amstrad, Apogee, Apple, Atari, Bally, Bandai,
;                  Benesse, Bit Corporation, Cambridge, Casio, Coleco,
;                  Commodore, Compukit, DEC, Elektronika, Emerson, Entex,
;                  Fairchild, GCE, IBM, Interact, Interton, Jupiter,
;                  Magnavox, Mattel, Microsoft, Miles Gordon Technology,
;                  MiSTer, NEC, Nintendo, Panasonic, PEL Varazdin, Philips,
;                  Sega, Sharp, Sinclair, SNK, Sony, Sord, SpecNext,
;                  Spectravideo, Tandy, Tangerine, Tatung, Tesla,
;                  Texas Instruments, Tomy, Video Technology, VTech, Watara
; ===================================================================
; Sync settings (Options -> Video Player), mostly for sound drifting out
; of step after rewinding or skipping (true/false):
; all files: correct audio/video drift quickly (-autosync 30)
AutoSync = true
; MP4 and MKV: use the file's own timestamps (-correct-pts)
CorrectPts = false
; files with MP3 audio (often AVI): accurate seeking (-hr-mp3-seek)
Mp3Seek = false
; AVI without an index: build one first, so seeking lands right (-idx)
AviIndex = false

; ========================
; Games Folders & Cores
; ========================
[Systems]
; Extra places laid out like a "games" folder, with a folder per system
; inside (e.g. /media/usb0/MoreGames/SNES). One line each, e.g.
; games_folder = /media/usb0/MoreGames
;
; An extra folder for one system, used as-is (no system subfolder needed).
; Format is SystemID:/path, one line each, e.g.
; system_folder = SNES:/media/usb0/SNES Hacks
; system_folder = PSX:/media/usb1/PSX Redump
;
; Use a different core for a system, one line each: SystemID:core. Easiest
; set from the menu (Options -> Game Database -> Cores), which browses the
; core files on every drive: their roots and "_" folders (not _Arcade).
; By hand, the core is its path from the SD card's root without ".rbf";
; a full path is tidied (/media/fat/_Unstable/SNES_20260901.rbf ->
; _Unstable/SNES_20260901), and a core on USB is ../usb0/_Cores/X. With
; the build date, that exact build loads; without it, the newest build of
; that name in the folder. A -launch -core option wins for that launch.
; set_core = SNES:_Unstable/SNES

; ========================
; Games Database
; ========================
; Leaves games out of the games database entirely: they won't appear in
; SAMenu, search or attract mode.
; Rebuild the games database after changing anything here.
[Database]
; Systems or groups to leave out completely, comma separated
; (e.g. Computer, NESMusic, SNESMusic)
Exclude =

; ------------------------
; Folder, file & extension rules
; ------------------------
; Sections named [Database.X] leave out only some games, where X is ALL,
; a system ID or a group (e.g. [Database.SNES], [Database.Nintendo]).
; [Attract.X] sections (further down) work exactly the same way.
;
;   Folders    = folder names inside a system (not the file name)
;   Files      = file names; the extension is optional, so "tetris"
;                also matches "tetris.nes" and "tetris.smc"
;   Extensions = with or without the dot (e.g. "nes" or ".nes")
;   Paths      = a location and everything under it (e.g. /media/usb1)
;
; Matching ignores case:
;   hack    exactly "hack"
;   hack*   starts with "hack"
;   *hack   ends with "hack"
;   *hack*  contains "hack"
;
; Examples:
;   [Database.ALL]
;   Files      = *(Proto)*, *(Beta)*
;   Paths      = /media/usb1
;
;   [Database.SNES]
;   Folders    = Hacks
;   Extensions = bs
;
; Leave fields empty if not used.
[Database.ALL]
Folders    =
Files      =
Extensions =
Paths      =

; ========================
; Game Lists
; ========================
; Per-system game lists used by attract mode. They live in the Lists
; folder next to this file, one file per system, e.g.
;   Lists/Blacklist/SNES_blacklist.txt
;   Lists/Staticlist/SNES_staticlist.txt
;   Lists/Whitelist/SNES_whitelist.txt
; One game title per line (with or without its file extension). Lines
; starting with # or ; are ignored. Titles are matched ignoring case and
; punctuation.
;
; Each list has Use (true/false) plus Include and Exclude, which take
; system IDs and groups like everywhere else (leave Include blank for all).
[List]

; Blacklist: games attract mode never plays. The static detector adds
; games that sit on a black screen (see [StaticDetector]).
UseBlacklist = true
BlacklistInclude =
BlacklistExclude =

; Staticlist: remembers the point where each game stops moving (e.g. it
; reaches a still title screen). The static detector writes it for you,
; one line per game with the time in seconds, e.g. "<42> Game Name"
; means the screen froze 42 seconds in.
; Attract mode then moves on to the next game SkipafterStatic seconds
; after that point, instead of sitting on a frozen screen until its
; PlayTime runs out. Example: frozen at 42s + SkipafterStatic 10 = the
; game plays for 52 seconds (or less, if PlayTime is shorter).
UseStaticlist = true
StaticlistInclude =
StaticlistExclude =
SkipafterStatic = 10

; Whitelist: a list you make yourself. For a system that has a whitelist
; file, attract mode only plays the games on it.
UseWhitelist = false
WhitelistInclude =
WhitelistExclude =

; ========================
; Attract mode settings
; ========================
[Attract]
; Seconds each game is played
; Can be a single number (e.g. 40)
; Or a range (e.g. 40-130) to randomize between min and max
PlayTime = 45-60

; How games are picked (also used by SAMenu's [Pick Random Game]
; and -random):
;   Balanced         systems weighted by the square root of their size: big
;                    libraries still come up more, but don't take over
;   Per game         every game equally likely (big libraries dominate)
;   Per system       a random system, then a game (equal airtime)
;   By category      a random category (Console, Computer...), then a
;                    system, then a game
;   By manufacturer  the same with manufacturers
;   Round robin      each system in turn (A-Z), a random game from each
;   Time machine     each system in turn by release date, oldest first
;   In order         every game in turn, system by system, A-Z
; (The in-turn modes pick Balanced for a single random game.)
Selection = Balanced
; Every game plays once before any repeats (true/false)
NoRepeats = true
; Never the same system twice in a row (true/false)
MixSystems = true
; One version per title: "Tetris (USA)", "Tetris (Europe)" and "Tetris
; (Japan)" count as one game (USA, then World, Europe...; clean releases
; before betas and hacks), and a multi-disc game as one, disc 1 (true/false)
OneVersion = true
; Never pick games with these tags in their names, comma separated:
;   Beta, Proto, Demo, Program, Hack, Translation, Unlicensed, Homebrew,
;   Cheat / Trainer / Fixed, Bad dump, Alternate, Disc 2+, Re-releases
; Tags only match inside ( ) or [ ] as whole words: Demo never catches
; "Demolition Man". Disc 2+ is (Disc 2) and up, (Side B), (Tape 2)...
SkipTags =

; Arcade games' screen orientation, from each MRA's <rotation> line (read
; when the games database is built): Both, Horizontal, Vertical, Vertical
; CW or Vertical CCW. Vertical plays both directions; CW and CCW suit a
; rotated screen that only turns one way (MRAs that just say "vertical"
; count for both). MRAs with no rotation line take it from other versions
; of the same game, and are skipped if it's still unknown (unless Both).
Orientation = Both

; The attract playlist in use: Normal (your usual setup, as above) or the
; name of a [Playlist.X] section below. Also in the menu: Options ->
; Attract Mode -> Playlists.
Playlist = Normal

; Systems or groups to include or exclude from Attract mode, comma
; separated (see the lists at the top). Leave Include blank for all.
; Include narrows the pool, then Exclude removes from it (Exclude wins), e.g.
;   Include = Console, AmigaVision
;   Exclude = Nintendo, MegaCD
Include =
Exclude =

; Enable static detector during Attract mode (true/false)
; (see [StaticDetector] below)
UseStaticDetector = true

; "Other buttons" (Options -> Controls): what a key or button with no action does
; while attract mode plays (actions are set in the [InputDetector.X]
; sections below, or Options -> Controls):
; Ignore (do nothing), Play (play the game) or Stop (back to menu)
OtherInput = Play


; Mute MiSTer's sound while attract mode plays; it comes back on when
; attract mode stops or you choose to play a game (true/false)
Mute = false

[Weights]
; Make systems or groups come up more or less often when games are picked:
; name = number (2 = twice as often, 0.5 = half as often, 0 = never).
; Multiplies the Selection above; several matching entries multiply.
; SNES = 3
; Computer = 0.5
; Arcade = 2

; Leave some games out of attract mode only (they still appear in the
; SAMenu and search). Same rules as [Database.X] above: use
; [Attract.ALL], a system ID or a group (e.g. [Attract.NES]).
; Takes effect straight away, no rebuild needed.
[Attract.ALL]
Folders    =
Files      =
Extensions =
Paths      =

; ========================
; Music Player
; ========================
; Background music from /media/fat/music (MP3 and OGG), also in the menu:
; Options -> Music Player. Each folder inside the music folder is a
; playlist.
[Music]
; Random or In order
Playback = Random
; Empty = the music folder itself, All = every folder, or a folder name
Playlist =
; Pause while a game plays (MiSTer mixes this music into every core's
; sound), carrying on in the MiSTer menu (true/false)
PauseInGames = true

; ========================
; Video Player
; ========================
; Options -> Video Player. Put videos in /media/fat/video; each folder
; inside it is a playlist. Videos play on the MiSTer's Linux screen at
; 640x480 (MiSTer's scaler fills the TV), decoded by the MiSTer's own
; processor: SD video around 480p plays well, 720p and up or HEVC doesn't.
; Formats: mp4, m4v, mov, mkv, webm, avi, mpg, mpeg, ts, wmv, asf, ogv, flv.
; While a video plays from the menu, on a controller: A = next video,
; B = stop, X = pause, left/right = back/forward 10s, up/down = 1 minute.
; The music player pauses while a video plays.
; Controls while a video plays (a controller works too: MiSTer turns
; its buttons into these keys):
;   Left / Right       back / forward 10 seconds     (d-pad left / right)
;   Up / Down          forward / back 1 minute       (d-pad up / down)
;   Page Up / Down     forward / back 10 minutes     (L / R shoulder)
;   Space              pause                         (X)
;   Enter or Esc       exit                          (A or B, e.g. circle)
;   9 / 0              volume down / up
;   m                  mute
[Video]
; Random or In order (for "Play playlist" and attract mode)
Playback = Random
; Empty = the video folder itself, All = every folder, or a folder name
Playlist =
; Play a video between attract mode games, every this many games
; (0 = never). Next skips the video, Stop stops attract mode as usual.
AttractEvery = 0

; ========================
; Startup
; ========================
; What starts when the MiSTer boots. Set from the menu (Options ->
; Startup): the menu then writes a marked block into
; /media/fat/linux/user-startup.sh, leaving the rest
; of that file alone. Changing these lines by hand needs the menu to
; save once to take effect.
[Startup]
; Nothing, SAMenu or Attract mode (only one: both want the screen)
Start = Nothing
; Start the music player (true/false)
Music = false
; With Start = Attract mode, when it starts:
;   Instantly       as soon as the MiSTer has started
;   After a delay   AttractDelay seconds after that; AttractPress says what
;                   a press during the wait does:
;                     Restarts the countdown  starts once left alone that long
;                     Cancels it              no attract mode this boot
;                     Is ignored              always starts (kiosk, cabinet)
;   When idle       whenever nothing has been pressed for IdleTime minutes,
;                   from boot on (a small watcher runs in the background),
;                   counting in IdleWhere: MiSTer menu (and the games
;                   menu), Games, or Menu+Games. With games included,
;                   attract mode also comes back after you choose to play
;                   one of its games and put the controller down (Back
;                   returns to it). Other scripts running (e.g.
;                   update_all) always hold it off.
AttractWhen = Instantly
AttractDelay = 60
AttractPress = Restarts the countdown
IdleTime = 5
IdleWhere = MiSTer menu

; ========================
; BIOS Skip
; ========================
; Button presses after a game loads, to get past BIOS screens. SAMenu plugs
; in a virtual pad before the game loads, presses the sequence, then
; unplugs it. The switches are also in Options -> Controls.
[BiosSkip]
; After attract mode launches a game (true/false)
Attract = true
; After you launch a game from SAMenu (true/false)
Menu = true

; Easiest set up in Options -> Controls -> BIOS Skip, where each step can
; be added by pressing the button or key.
; Per system, [BiosSkip.<system ID>] Sequence = what to press, in order:
;   a number    pause for that many seconds (start with one: the game
;               needs time to load)
;   a b x y l r select start home up down left right
;               virtual pad buttons (MiSTer's default map)
;   key:enter, key:space, key:f1 ...
;               keyboard keys (only for cores that read a keyboard)
; Test a sequence on a running game with: SAMenu.sh -press start
[BiosSkip.FDS]
Sequence = 10, a

; ========================
; Input Detection Settings
; ========================
; Watches keyboards, mice and controllers while attract mode runs. Turn
; each kind on or off here; what each input does is set in the sections
; below (or from SAMenu: Options -> Controls).
;
; To see an input's name, run the input test, which prints every press
; (e.g. "joystick (8BitDo Pro 2): dpleft"):
;   /media/fat/Scripts/SAMenu.sh -inputs
; Controllers the SDL controller database doesn't know use raw names
; like btn0, axis0+ (d-pads are still dpup, dpdown, dpleft, dpright).
[InputDetector]
Mouse = true
Keyboard = true
Joystick = true
; Analog sticks: whether they count at all (true/false). Buttons and the
; d-pad always count.
Sticks = true
; How long (milliseconds) a stick must stay pushed before it counts, so a
; glitch doesn't (e.g. an empty controller-adapter port jumping for an
; instant). Buttons and the d-pad are always instant.
StickHoldMs = 75

; Attract mode controls, as input = action. Actions:
;   next       next game: forward through the history if you went back,
;              otherwise a new random game (as when the play time ends)
;   back       previous game in the history (the last 100 are kept)
;   play       stop attract mode and keep playing this game
;   stop       stop attract mode and go back to the menu
;   blacklist  never play this game in attract mode again, next game
;   stay       stay on this game (no timer, no skipping); again to resume
;   menu       close the game and open SAMenu on the TV
;   search     press once: type a search on the keyboard (no screen; Enter
;              plays the games it finds first, Esc cancels). Press twice
;              quickly: close the game and open SAMenu on the TV
; Leave an input empty (or remove it) for no action.
[InputDetector.Mouse]
left  = back
right = next

[InputDetector.Keyboard]
left   = back
right  = next
enter  = play
esc    = stop
delete = blacklist
space  = stay
"`"    = search

[InputDetector.Joystick]
dpleft   = back
dpright  = next
leftx-   = back
leftx+   = next
start    = play
back     = stop
; digital buttons
a         =
b         =
x         =
y         =
guide     =
touchpad  =
leftshoulder  =
rightshoulder =
leftstick     =
rightstick    =
dpup      =
dpdown    =
misc1     =
misc2     =
paddle1   =
paddle2   =
paddle3   =
paddle4   =
; analog triggers
lefttrigger-  =
lefttrigger+  =
righttrigger- =
righttrigger+ =
; analog sticks
lefty-   =
lefty+   =
rightx-  =
rightx+  =
righty-  =
righty+  =

; ========================
; SAMenu Controls
; ========================
; SAMenu controls. A controller works in the menu because MiSTer
; turns its buttons into keys: A = enter, B = esc, X = space, Y = tab,
; L/R = page up/down. Y opens Search and X opens Options (fixed).
; Set from the menu: Options -> Controls -> Menu Layout.
;
; Layout: Western (A confirms, B backs out) or Japanese (B confirms,
; A backs out). Japanese swaps Enter and Esc, on a keyboard too.
[Controls.Menu]
Layout = Western
; The games menu's actions (Options -> Controls -> Games Menu). Each works
; in one place, so one button can do different things: Search and Options
; on the systems list, Favourite in a game list (marks it with "* "),
; Remove in [Favourites]. Inputs are keys (tab, space, a letter...: MiSTer
; turns A/B/X/Y/L/R into enter/esc/space/tab/pageup/pagedown), or
; pad:<name> for a controller button MiSTer doesn't pass on (pad:start,
; pad:back, pad:lefttrigger...: names as the Input test shows them).
; Separate several with commas. PrevLetter and NextLetter jump any list
; by letter (back to the start of the letter, on to the next one); no
; controller button by default: map pad:lefttrigger / pad:righttrigger (L2
; and R2) from the menu, as your controller names them.
Search = tab
Options = space
Favourite = tab
Remove = space
PrevLetter = [
NextLetter = ]

; ========================
; Static Detector Settings
; ========================
; Watches the screen while attract mode plays a game (turn it on with
; UseStaticDetector in [Attract]). After the Grace period, a screen that
; stays black or unchanged too long can add the game to its Blacklist or
; Staticlist (see [List]) and skip to the next game. Times are seconds.
; To watch what the detector sees, live, from a PC:
;   ssh -t root@<mister-ip> "/media/fat/Scripts/SAMenu.sh -watch"
[StaticDetector]
;Time the screen must be black
BlackThreshold = 30
;Time the screen must be static
StaticThreshold = 30

;Skip games with black screens
SkipBlack = true
;Update and maintain Black lists
WriteBlackList = true

;Skip games with static screens
SkipStatic = true
;Update and maintain Static lists
WriteStaticList = true
;Grace period before counting a screen as static
Grace = 25
; What counts as moving. The screen is split into a 16x12 grid (192
; cells), and it counts as moving only if at least MinSpread cells changed
; in the last SpreadTime seconds. So change stuck in one spot counts as
; static, however big it is, and small sprites that travel around count
; as moving, however small they are. Measured on test screens (5s window):
;   flashing cursor 1 cell, blinking "PRESS START" 6, slow walking
;   sprite 10-20, Pong ball 19-26, Pac-Man-style ghosts 58-67,
;   scrolling 192.
; Raise MinSpread to skip more "nearly still" screens, lower it if slow,
; simple games get skipped by mistake (e.g. per system:
; [StaticDetector.Atari2600]). 1 = any change at all counts as moving.
MinSpread = 8
SpreadTime = 5
; Also show the screen's most common colour in -watch (the average is
; always shown). Off saves the detector sorting every frame's samples.
DominantColour = false

; Overrides for a system or a group, e.g. [StaticDetector.PSX] or
; [StaticDetector.Computer]. Only the settings you list are changed; a
; system's own section wins over a group's.
[StaticDetector.PSX]
Grace = 30

; ========================
; SAMenu Settings
; ========================
; How SAMenu shows each system, e.g. "[Nintendo] NES".
; These are saved automatically when you change them in the menu under
; Options -> Display & Sorting -> Menu list options, but can also be edited here.
[Menu]
; Where lines sit in the list: Left, Center or Right
LabelAlign = Left
; Between manufacturer and system: Space, Dash, Colon, Pipe or Arrow
LabelDivider = Space
; Line up the dividers in one column (true/false)
LabelAlignDivider = false
; Around the manufacturer: None, [ ], ( ), < >, { },
; [ spaced ], ( spaced ), < spaced > or { spaced }
LabelEncapsulate = [ ]
; Text size on the MiSTer's own screen: Auto, Normal, Large, Extra large
; or Huge. The menu sets it while open and restores it on exit, so fb_size
; in MiSTer.ini can stay as it is. Auto picks the biggest text that still
; leaves at least a 60x20 grid (on a 1080p TV that's Huge).
TextSize = Auto
; Open where you left off (the folder and line you were on when you last
; launched a game or exited), true/false. If that spot is gone, it opens
; as close to it as it can.
RememberPosition = false
; Show the manufacturer at all (true/false). Off shows just the system's
; full name, e.g. "Atari 2600".
ShowManufacturer = true

; ---- Menu list sorting (Options -> Display & Sorting -> Menu list sorting) ----
; Up to two levels of groups, then the systems inside them, e.g. by
; category (custom order), then manufacturer A-Z, then release date.
; First group by: Manufacturer, Category or None
SystemGroup = Category
; Order of those groups: A-Z, Oldest first (by each group's earliest
; system) or Custom (Category only, uses CategoryOrder)
SystemGroupOrder = Custom
; Custom category order, comma separated. Categories left out go last.
CategoryOrder = Arcade, Console, Handheld, Computer, Other
; Then group by (inside the first groups, always A-Z): Manufacturer,
; Category or None
SystemSubgroup = Manufacturer
; Show the first-level groups as one List, or as Folders you open (the
; Arcade Cores stay on the top screen when ArcadeFirst is on)
GroupView = Folders
; With List, a heading above each first-level group: Off, Line, Double, Brackets,
; Dots or Minimal, e.g. Brackets: =====[  COMPUTERS  ]=====
GroupHeaders = Off
; Order of the systems inside the groups: Release date or A-Z
SystemOrder = Release date
; Always put the Arcade Cores at the top of the list (true/false)
ArcadeFirst = false

; ---- Game list sorting (Options -> Display & Sorting -> Game list sorting) ----
; Also used for search results.
; Where folders go: First, Last or Mixed (in with the games)
FolderPosition = First
; Alphabetical, or Natural (numbers by value: "Game 2" before "Game 10")
GameOrder = Natural
; Sort "The Legend of Zelda" under L (true/false)
IgnoreThe = false
; Hide file extensions in game lists and search results (true/false)
HideExtensions = false
; Put multi-disc games ("(Disc 1)", "(Disc 2)"...) in a folder of their
; own, listed in with the games (true/false). Also in A-Z folders.
GroupDiscs = false

; ---- Virtual A-Z Folders (Options -> Display & Sorting) ----
; Systems that get a [Games A-Z] folder at the top, listing every game from
; all their folders once, A-Z. Handy for big sets sorted into genres (e.g.
; PlayStation) without keeping a second copy. Only systems with subfolders
; get one. System IDs or groups, comma separated (e.g. PSX, Saturn).
VirtualAZFolders =

; ---- Pick Random Game (Options -> Display & Sorting) ----
; Show [Pick Random Game] at the top of the systems list and every folder:
; it launches a random game from that level down, picked like attract mode
; (Selection, OneVersion and [Weights] above) (true/false)
RandomEntry = true
; Show [Genre Collection] on the systems list: every game by genre, across all
; systems (e.g. [Genre Collection] > Fighting). Genres come from your genre folders
; when the games database is built (true/false). See [Genres] below.
GenresEntry = true
; In [Genre Collection], where each game's system is shown: Before
; ("[SNES] Street Fighter II"), After ("Street Fighter II [SNES]") or Off
GenresSystem = Before
; In [Genre Collection], the order of the games: Game name, or System (the systems
; list's own order, then game name)
GenresOrder = Game name
;
; [History] on the systems list: the games you launch from SAMenu, newest
; first, with the day played ("Today", "26 Sep"), kept on the SD card. If
; attract mode has played since the MiSTer started, [History] has two
; folders: Attract (what it played, newest first) and Games Menu.
; Also Options -> Display & Sorting -> [History].
HistoryEntry = true
; A game played again moves to the top instead of being listed twice
HistoryMoveToTop = true
; How many games [History] keeps
HistoryKeep = 100
; Where each game's system is shown: Before, After or Off
HistorySystem = Before
;
; Favourites (true/false): in a game list the Fav button (Square) marks
; the highlighted game with "* " (it doesn't change the order), and
; [Favourites] on the systems list lists them, where Remove (Triangle)
; takes one off. Also Options -> Display & Sorting -> [Favourites].
Favourites = true
; Where each game's system is shown in [Favourites]: Before, After or Off
FavouritesSystem = Before
; Systems (or groups) left out of [Genres], comma separated, e.g.
; Computer, NES. They still appear everywhere else in the menu.
GenresExclude =

; ---- Hide games tagged (Options -> Display & Sorting -> Game list sorting) ----
; Leave games with these name tags out of the menu's lists (and Pick Random
; Game), comma separated:
;   Beta, Proto, Demo, Program, Hack, Translation, Unlicensed, Homebrew,
;   Cheat / Trainer / Fixed, Bad dump, Alternate, Disc 2+, Re-releases
HideTags =
; Leave them out of Search results too (true/false)
SearchHidden = true

; ========================
; Genres
; ========================
; A game's genres come from the folders it's in, when the games database
; is built: "SNES/Genres/Fighting/..." is Fighting, "_Fighter",
; "[Sports]", "Shoot 'em Ups", "Puzzle - Logic" and many other spellings
; are recognised. A folder only counts when its whole name is a genre
; (a folder named after a game, like "Street Fighter II", doesn't).
; Sub-genres count as their genre too: Golf is also Sports.
; Check what was found with:  SAMenu.sh -genres
;
; Add your own folder names (wildcards allowed) as Genre = names, or
; Genre/Sub-genre = names. A new genre name makes a new genre. Rebuild
; the games database afterwards.
[Genres]
; Fighting = My Fighters, VS Games
; Sports/Golf = Golfing

; Your own game file names for genres, the same way
[Genres.Files]
; Fighting = Street Fighter*, Tekken*

; ========================
; Attract Playlists
; ========================
; A playlist decides which games attract mode plays, by genre (see
; [Genres]), as a layer over your normal setup: switch back to Normal and
; everything is as it was. Play time, the detector, blacklists,
; orientation and skip tags still apply. Easiest made in the menu
; (Options -> Attract Mode -> Playlists), or by hand:
;
; [Playlist.Fighters Night]
; Name   = Fighters Night
; All    = Fighting, Beat 'em Up   ; genres for every system
; SNES   = Puzzle                  ; extra genres for one system (system ID)
; Saturn = Sports/Golf             ; a sub-genre
; Others = Leave out               ; systems with no picks: Leave out / As normal
; Skip   = *mahjong*, *pachinko*  ; never play games matching these (file
;                                 ; names or any folder they're in)
; SNES.Skip = *shogi*             ; a Skip just for one system
; Exclude = Computer, NES         ; systems (or groups) never played
;
; Skip patterns use * wildcards and ignore capitals, and apply to
; everything the playlist plays (per-system ones only to that system).
; Skip is also in the menu, as plain words (saved as *word*);
; per-system skips are ini-only.
;
; Custom genres ("Create custom genre..." in the menu's genre screens):
; a pattern among the genres, like "All = Fighting, *mario*", picks every
; game with that word in its name or folder, whatever its genre.
; "As normal" systems follow [Attract] Include/Exclude; while a playlist
; is on, Include/Exclude only matter for those. With All genres picked,
; every system has picks ("Set by All Systems" in the menu), so Others
; makes no difference: systems without those genres just play nothing.
